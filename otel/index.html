<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=../demo/?ad=Otel&tur=otel">
<title>Otel — WhatsApp Asistanı (Örnek)</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b141a;color:#cfeee7;display:grid;place-items:center;height:100vh;margin:0}</style>
</head>
<body>
<p>Yönlendiriliyor…</p>
<script>location.replace('../demo/?ad='+encodeURIComponent("Otel")+'&tur=otel');</script>

<script>/* BBA-DEMO-BEACON — demo açılma ölçümü (ilk etkileşimde, crawler ötmesin) */
(function(){try{
  var m=location.pathname.replace(/\/+$/,'').split('/');
  var slug=(m[m.length-1]||'').toLowerCase().replace(/[^a-z0-9_-]/g,'');
  if(!slug||slug==='alya-panel')return;
  var k='bbaopen_'+slug, gonder=function(){
    try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');
      navigator.sendBeacon('https://alya-konsiyerj.up.railway.app/api/demo-open?slug='+encodeURIComponent(slug));
    }catch(e){}};
  ['pointerdown','keydown','touchstart','scroll'].forEach(function(ev){
    document.addEventListener(ev,function o(){document.removeEventListener(ev,o);gonder();},{once:true,passive:true});});
}catch(e){}})();
</script>
</body>
</html>
